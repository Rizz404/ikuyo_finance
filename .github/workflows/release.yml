name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v1.0.0)'
        required: true
        type: string
      pre_release:
        description: 'Mark as pre-release?'
        required: false
        type: boolean
        default: false

env:
  # * SDK used to resolve and test pubspec.lock; bump together with the lock
  FLUTTER_VERSION: '3.44.5'

jobs:
  build:
    name: Build APKs
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    env:
      IKUYO_REQUIRE_RELEASE_SIGNING: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            VERSION="$REF_NAME"
          else
            VERSION="$INPUT_VERSION"
          fi
          if ! printf '%s' "$VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$'; then
            echo "::error::Invalid version '$VERSION' (expected vMAJOR.MINOR.PATCH)"
            exit 1
          fi
          BUILD_NAME="${VERSION#v}"
          BUILD_NUMBER=$(grep '^version:' pubspec.yaml | sed 's/.*+//')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "build_name=$BUILD_NAME" >> $GITHUB_OUTPUT
          echo "build_number=$BUILD_NUMBER" >> $GITHUB_OUTPUT
          echo "Resolved: version=$VERSION build_name=$BUILD_NAME build_number=$BUILD_NUMBER"

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '21'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Verify required secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          MISSING=""
          for name in SUPABASE_URL SUPABASE_ANON_KEY KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_PASSWORD KEY_ALIAS; do
            eval "value=\${$name}"
            if [ -z "$value" ]; then MISSING="$MISSING $name"; fi
          done
          if [ -n "$MISSING" ]; then
            echo "::error::Missing required secrets:$MISSING"
            exit 1
          fi

      - name: Create .env
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          printf 'SUPABASE_URL=%s\n' "$SUPABASE_URL" > .env
          printf 'SUPABASE_ANON_KEY=%s\n' "$SUPABASE_ANON_KEY" >> .env

      - name: Setup release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/ikuyo-release.jks
          {
            printf 'storePassword=%s\n' "$KEYSTORE_PASSWORD"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'storeFile=ikuyo-release.jks\n'
          } > android/key.properties

      - name: Flutter pub get (locked)
        run: flutter pub get --enforce-lockfile

      - name: Analyze
        run: flutter analyze --no-pub

      - name: Test
        run: flutter test --no-pub

      - name: Build universal APK
        run: |
          # * Build WITH pub so flutter_tools regenerates the plugin registrant in
          # * release mode (dev_dependency plugins excluded, matching the release
          # * Gradle graph); `pub get` alone writes the debug-mode registrant.
          # * Touching the lock makes the build's own pub step skip as up to date,
          # * and the lock must stay byte-identical (no re-resolution).
          touch pubspec.lock
          flutter build apk --release \
            --build-name=${{ steps.version.outputs.build_name }} \
            --build-number=${{ steps.version.outputs.build_number }}
          git diff --exit-code -- pubspec.lock

      - name: Build ABI-split APKs
        run: |
          touch pubspec.lock
          flutter build apk --release --split-per-abi \
            --build-name=${{ steps.version.outputs.build_name }} \
            --build-number=${{ steps.version.outputs.build_number }}
          git diff --exit-code -- pubspec.lock

      - name: Rename APKs
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          cd build/app/outputs/flutter-apk
          mv app-release.apk             "ikuyo-finance-${VERSION}-universal.apk"
          mv app-arm64-v8a-release.apk   "ikuyo-finance-${VERSION}-arm64-v8a.apk"
          mv app-armeabi-v7a-release.apk "ikuyo-finance-${VERSION}-armeabi-v7a.apk"
          mv app-x86_64-release.apk      "ikuyo-finance-${VERSION}-x86_64.apk"

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apks-${{ steps.version.outputs.version }}
          path: build/app/outputs/flutter-apk/ikuyo-finance-*.apk
          retention-days: 7

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download APK artifacts
        uses: actions/download-artifact@v4
        with:
          name: apks-${{ needs.build.outputs.version }}
          path: apks/

      - name: Generate release notes
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          PREV_TAG=$(git tag --sort=-version:refname | grep -v "^${VERSION}$" | head -1)

          if [ -z "$PREV_TAG" ]; then
            LOG_RANGE="HEAD"
          else
            LOG_RANGE="${PREV_TAG}..HEAD"
          fi

          FEATURES=$(git log "$LOG_RANGE" --pretty=format:"%s" --grep="^feat" | sed 's/^[a-z]*([^)]*): //;s/^[a-z]*: //' | sed 's/^/- /')
          FIXES=$(git log "$LOG_RANGE" --pretty=format:"%s" --grep="^fix" | sed 's/^[a-z]*([^)]*): //;s/^[a-z]*: //' | sed 's/^/- /')
          PERF=$(git log "$LOG_RANGE" --pretty=format:"%s" --grep="^perf" | sed 's/^[a-z]*([^)]*): //;s/^[a-z]*: //' | sed 's/^/- /')
          REFACTOR=$(git log "$LOG_RANGE" --pretty=format:"%s" --grep="^refactor" | sed 's/^[a-z]*([^)]*): //;s/^[a-z]*: //' | sed 's/^/- /')

          {
            echo "## What's Changed"
            echo ""
            if [ -n "$FEATURES" ]; then
              echo "### ✨ Features"
              echo "$FEATURES"
              echo ""
            fi
            if [ -n "$FIXES" ]; then
              echo "### 🐛 Bug Fixes"
              echo "$FIXES"
              echo ""
            fi
            if [ -n "$PERF" ]; then
              echo "### ⚡ Performance"
              echo "$PERF"
              echo ""
            fi
            if [ -n "$REFACTOR" ]; then
              echo "### ♻️ Refactoring"
              echo "$REFACTOR"
              echo ""
            fi
            echo "---"
            echo ""
            echo "## 📥 Download"
            echo ""
            echo "| APK | Architecture | Recommended For |"
            echo "|-----|-------------|-----------------|"
            echo "| \`ikuyo-finance-${VERSION}-universal.apk\` | Universal | All devices (larger file) |"
            echo "| \`ikuyo-finance-${VERSION}-arm64-v8a.apk\` | arm64-v8a | Most modern Android (2017+) |"
            echo "| \`ikuyo-finance-${VERSION}-armeabi-v7a.apk\` | armeabi-v7a | Older Android phones |"
            echo "| \`ikuyo-finance-${VERSION}-x86_64.apk\` | x86_64 | Emulators / x86 devices |"
            echo ""
            echo "## 📋 Requirements"
            echo ""
            echo "- Android 6.0 (API 23) or higher"
            echo "- ~84 MB storage (universal) or ~30 MB (ABI-specific)"
          } > release-notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.build.outputs.version }}
          PRE_RELEASE: ${{ inputs.pre_release }}
        run: |
          ARGS="--latest"
          if [ "$PRE_RELEASE" = "true" ]; then
            ARGS="--prerelease"
          fi

          if gh release view "${VERSION}" >/dev/null 2>&1; then
            echo "::error::Release ${VERSION} already exists; refusing to delete or overwrite it"
            exit 1
          fi

          gh release create "${VERSION}" \
            --title "Ikuyo Finance ${VERSION}" \
            --notes-file release-notes.md \
            $ARGS \
            "apks/ikuyo-finance-${VERSION}-universal.apk" \
            "apks/ikuyo-finance-${VERSION}-arm64-v8a.apk" \
            "apks/ikuyo-finance-${VERSION}-armeabi-v7a.apk" \
            "apks/ikuyo-finance-${VERSION}-x86_64.apk"
