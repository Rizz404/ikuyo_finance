name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v1.0.0)'
        required: true
        type: string
      pre_release:
        description: 'Mark as pre-release?'
        required: false
        type: boolean
        default: false

env:
  # * SDK used to resolve and test pubspec.lock; bump together with the lock
  FLUTTER_VERSION: '3.44.5'
  # * same objectbox-c release and digest as qa.yml (host tests only)
  OBX_C_VERSION: '5.0.0-rc'
  OBX_C_SHA256: '280195f19594227068fcf389d32d5b315c9a6daabc3115cd3aac9c3cc8ad39a8'
  # * public SHA-256 of the historical Ikuyo release signing certificate
  RELEASE_EXPECTED_CERT_SHA256: '3cb92848113a05569dc0647b1d1563d094b47ad167f0ee2ffdf382591c546feb'
  APP_ID: 'rizz.learn.finance.ikuyo_finance'
  # * Flutter 3.44.5 default minSdkVersion (android/app uses flutter.minSdkVersion)
  MIN_SDK: '24'

jobs:
  build:
    name: Build APKs
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}

    env:
      IKUYO_REQUIRE_RELEASE_SIGNING: 'true'
      # * fail-closed production backend config check (stdlib only, values never printed)
      PROD_ENV_CHECK_PY: |
        import ipaddress
        import re
        import sys
        import urllib.parse


        def reject(reason):
            print("::error::production .env rejected: " + reason)
            sys.exit(1)


        if len(sys.argv) != 2:
            reject("expected one .env path or -")
        if sys.argv[1] == "-":
            raw = sys.stdin.buffer.read()
        else:
            with open(sys.argv[1], "rb") as f:
                raw = f.read()
        if not re.fullmatch(rb"(?:[\x21-\x7e]+\n)+", raw):
            reject("expected non-empty KEY=VALUE lines (printable ASCII, no spaces/CR, final LF)")
        text = raw.decode("ascii")
        pairs = [line.split("=", 1) for line in text.splitlines()]
        if any(len(p) != 2 for p in pairs):
            reject("every line must be KEY=VALUE")
        if sorted(k for k, _ in pairs) != ["SUPABASE_ANON_KEY", "SUPABASE_URL"]:
            reject("expected exactly one SUPABASE_URL and one SUPABASE_ANON_KEY")
        config = dict(pairs)
        url, key = config["SUPABASE_URL"], config["SUPABASE_ANON_KEY"]
        markers = ("127.0.0.1", "localhost", "synthetic", "placeholder", "changeme", "not-a-secret")
        if any(m in url.lower() or m in key.lower() for m in markers):
            reject("contains a synthetic or local marker")
        if not re.fullmatch(r"[A-Za-z0-9_.~+/=-]{20,}", key):
            reject("SUPABASE_ANON_KEY is not a plausible public anon key")
        if not url.startswith("https://") or "\\" in url:
            reject("SUPABASE_URL must be an https:// URL")
        try:
            parts = urllib.parse.urlsplit(url)
            host = parts.hostname
            port = parts.port
        except ValueError:
            reject("SUPABASE_URL is not a valid URL")
        if parts.scheme != "https" or not host or "@" in parts.netloc or parts.query or parts.fragment or parts.path not in ("", "/") or port == 0:
            reject("SUPABASE_URL must be https://host[:port][/] without userinfo, path, query or fragment")
        try:
            ip = ipaddress.ip_address(host)
        except ValueError:
            ip = None
        if ip is not None:
            if ip.version == 6 and ip.ipv4_mapped is not None:
                ip = ip.ipv4_mapped
            if not ip.is_global:
                reject("SUPABASE_URL host is not a public address")
        else:
            labels = host.split(".")
            if (
                len(labels) < 2
                or not all(re.fullmatch(r"(?!-)[a-z0-9-]{1,63}(?<!-)", label) for label in labels)
                or not re.fullmatch(r"[a-z]{2,63}|xn--[a-z0-9-]{1,59}", labels[-1])
            ):
                reject("SUPABASE_URL host is not a public DNS name")
            reserved = ("localhost", "local", "localdomain", "internal", "test", "invalid", "example")
            if labels[-1] in reserved or ".".join(labels[-2:]) in ("example.com", "example.net", "example.org"):
                reject("SUPABASE_URL host is a reserved or local name")

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            VERSION="$REF_NAME"
          else
            VERSION="$INPUT_VERSION"
          fi
          set -euo pipefail
          if ! printf '%s' "$VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Invalid version '$VERSION' (expected vMAJOR.MINOR.PATCH)"
            exit 1
          fi
          # * the tag must name the pubspec version and point at the built commit
          PUBSPEC_VERSION="$(sed -n 's/^version: *//p' pubspec.yaml | tr -d '\r')"
          if ! printf '%s' "$PUBSPEC_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+\+[0-9]+$'; then
            echo "::error::pubspec version '$PUBSPEC_VERSION' is not MAJOR.MINOR.PATCH+BUILD"
            exit 1
          fi
          BUILD_NAME="${PUBSPEC_VERSION%%+*}"
          BUILD_NUMBER="${PUBSPEC_VERSION#*+}"
          if [ "$VERSION" != "v$BUILD_NAME" ]; then
            echo "::error::Tag $VERSION does not match pubspec version $PUBSPEC_VERSION"
            exit 1
          fi
          TAG_COMMIT="$(git rev-parse -q --verify "refs/tags/$VERSION^{commit}" || true)"
          COMMIT="$(git rev-parse HEAD)"
          if [ -z "$TAG_COMMIT" ] || [ "$TAG_COMMIT" != "$COMMIT" ]; then
            echo "::error::Tag $VERSION must exist and point at the checked out commit $COMMIT (tag: ${TAG_COMMIT:-missing})"
            exit 1
          fi
          # * Android only upgrades to a higher versionCode than any older release
          PREV_TAG="$(git tag --list 'v*.*.*' --sort=-version:refname | grep -vx "$VERSION" | head -n 1 || true)"
          if [ -n "$PREV_TAG" ]; then
            PREV_BUILD="$(git show "$PREV_TAG:pubspec.yaml" | sed -n 's/^version: *[^+]*+//p' | tr -d '\r')"
            if ! [ "$BUILD_NUMBER" -gt "${PREV_BUILD:-0}" ]; then
              echo "::error::Build number $BUILD_NUMBER must exceed $PREV_TAG build number ${PREV_BUILD:-?}"
              exit 1
            fi
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build_name=$BUILD_NAME" >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
          echo "Resolved: version=$VERSION build_name=$BUILD_NAME build_number=$BUILD_NUMBER commit=$COMMIT previous=${PREV_TAG:-none}"

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '21'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Verify required secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          MISSING=""
          for name in SUPABASE_URL SUPABASE_ANON_KEY KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_PASSWORD KEY_ALIAS; do
            eval "value=\${$name}"
            if [ -z "$value" ]; then MISSING="$MISSING $name"; fi
          done
          if [ -n "$MISSING" ]; then
            echo "::error::Missing required secrets:$MISSING"
            exit 1
          fi

      - name: Create synthetic loopback .env (analyze and test)
        run: |
          # * host tests never see backend secrets or signing material
          set -euo pipefail
          printf 'SUPABASE_URL=%s\n' 'http://127.0.0.1:9' > .env
          printf 'SUPABASE_ANON_KEY=%s\n' 'synthetic-qa-key-not-a-secret' >> .env

      - name: Flutter pub get (locked)
        run: flutter pub get --enforce-lockfile

      - name: Install ObjectBox native library (host tests)
        run: |
          set -euo pipefail
          test "$OBX_C_VERSION" = "5.0.0-rc"
          archive="objectbox-linux-x64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/objectbox/objectbox-c/releases/download/v5.0.0-rc/objectbox-linux-x64.tar.gz"
          echo "$OBX_C_SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/objectbox"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/objectbox"
          cp "$RUNNER_TEMP/objectbox/lib/libobjectbox.so" lib/

      - name: Analyze
        run: flutter analyze --no-pub

      - name: Test
        run: flutter test --no-pub

      - name: Create production .env (build only)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          rm -f lib/libobjectbox.so
          umask 077
          # * validate the secret values before any production .env exists (never echoed)
          if ! printf 'SUPABASE_URL=%s\nSUPABASE_ANON_KEY=%s\n' "$SUPABASE_URL" "$SUPABASE_ANON_KEY" | python3 -c "$PROD_ENV_CHECK_PY" -; then
            echo "::error::SUPABASE_URL/SUPABASE_ANON_KEY secrets are not a production backend config"
            exit 1
          fi
          printf 'SUPABASE_URL=%s\n' "$SUPABASE_URL" > .env
          printf 'SUPABASE_ANON_KEY=%s\n' "$SUPABASE_ANON_KEY" >> .env

      - name: Setup release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/ikuyo-release.jks
          {
            printf 'storePassword=%s\n' "$KEYSTORE_PASSWORD"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'storeFile=ikuyo-release.jks\n'
          } > android/key.properties
          test -s android/ikuyo-release.jks

      - name: Build universal APK
        run: |
          # * Build WITH pub so flutter_tools regenerates the plugin registrant in
          # * release mode (dev_dependency plugins excluded, matching the release
          # * Gradle graph); `pub get` alone writes the debug-mode registrant.
          # * Touching the lock makes the build's own pub step skip as up to date,
          # * and the lock must stay byte-identical (no re-resolution).
          touch pubspec.lock
          flutter build apk --release \
            --build-name=${{ steps.version.outputs.build_name }} \
            --build-number=${{ steps.version.outputs.build_number }}
          git diff --exit-code -- pubspec.lock

      - name: Build ABI-split APKs
        run: |
          touch pubspec.lock
          flutter build apk --release --split-per-abi \
            --build-name=${{ steps.version.outputs.build_name }} \
            --build-number=${{ steps.version.outputs.build_number }}
          git diff --exit-code -- pubspec.lock

      - name: Rename APKs
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          cd build/app/outputs/flutter-apk
          mv app-release.apk             "ikuyo-finance-${VERSION}-universal.apk"
          mv app-arm64-v8a-release.apk   "ikuyo-finance-${VERSION}-arm64-v8a.apk"
          mv app-armeabi-v7a-release.apk "ikuyo-finance-${VERSION}-armeabi-v7a.apk"
          mv app-x86_64-release.apk      "ikuyo-finance-${VERSION}-x86_64.apk"

      - name: Verify APKs (signer, package, version, minSdk, backend config)
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_NAME: ${{ steps.version.outputs.build_name }}
          BUILD_NUMBER: ${{ steps.version.outputs.build_number }}
        run: |
          # * Same fail-closed leaf signer rules as qa.yml, applied to every APK;
          # * split APK versionCodes follow Flutter's ABI_VERSION * 1000 + build.
          set -euo pipefail
          build_tools="$(ls -d "${ANDROID_HOME:?}"/build-tools/* | sort -V | tail -n 1)"
          echo "::notice::build-tools ${build_tools##*/}, apksigner $("$build_tools/apksigner" --version)"
          dir="build/app/outputs/flutter-apk"
          leaf='^(V[0-9]+(\.[0-9]+)? )?Signer( #[0-9]+)?:?( \(minSdkVersion=[0-9]+( \(dev release=true\))?, maxSdkVersion=[0-9]+\))? certificate SHA-256 digest: '
          if ! python3 -c "$PROD_ENV_CHECK_PY" .env; then
            echo "::error::workspace .env is not the production build config"
            exit 1
          fi
          for abi in universal:0 armeabi-v7a:1 arm64-v8a:2 x86_64:4; do
            apk="$dir/ikuyo-finance-${VERSION}-${abi%%:*}.apk"
            code=$(( ${abi#*:} * 1000 + BUILD_NUMBER ))
            case "${abi%%:*}" in
              universal) want_abis='arm64-v8a armeabi-v7a x86_64' ;;
              *) want_abis="${abi%%:*}" ;;
            esac
            if [ ! -s "$apk" ]; then
              echo "::error::missing APK $apk"
              exit 1
            fi
            status=0
            "$build_tools/apksigner" verify --verbose --print-certs "$apk" > "$apk.cert.txt" 2> "$apk.cert.err" || status=$?
            cat "$apk.cert.txt" "$apk.cert.err"
            if [ "$status" -ne 0 ]; then
              echo "::error::apksigner verify failed for $apk (exit $status)"
              exit 1
            fi
            out="$(tr -d '\r' < "$apk.cert.txt")"
            mapfile -t digests < <(grep -E "$leaf" <<< "$out" | sed -E "s/$leaf//" || true)
            all="$(grep -c ' certificate SHA-256 digest: ' <<< "$out" || true)"
            stamp="$(grep -cE '^Source Stamp Signer:? certificate SHA-256 digest: ' <<< "$out" || true)"
            count="$(grep -cx 'Number of signers: 1' <<< "$out" || true)"
            if [ "${#digests[@]}" -ne 1 ] || [ "$all" -ne $((${#digests[@]} + stamp)) ] || [ "$count" != "1" ]; then
              echo "::error::$apk: expected exactly one leaf signer certificate (leaf=${#digests[@]} digest_lines=$all stamp=$stamp)"
              exit 1
            fi
            if ! [[ "${digests[0]}" =~ ^[0-9a-fA-F]{64}$ ]]; then
              echo "::error::$apk: malformed signer certificate SHA-256 digest"
              exit 1
            fi
            actual="$(tr 'A-F' 'a-f' <<< "${digests[0]}")"
            if [ "$actual" != "$RELEASE_EXPECTED_CERT_SHA256" ]; then
              echo "::error::$apk: APK signer mismatch (actual=$actual expected=$RELEASE_EXPECTED_CERT_SHA256)"
              exit 1
            fi
            badging="$("$build_tools/aapt2" dump badging "$apk" | tr -d '\r')"
            pkg="$(grep -m1 '^package: ' <<< "$badging" || true)"
            want="package: name='$APP_ID' versionCode='$code' versionName='$BUILD_NAME'"
            if [ "${pkg:0:${#want}}" != "$want" ]; then
              echo "::error::$apk: unexpected package line '$pkg' (expected prefix '$want')"
              exit 1
            fi
            if [ "$(grep -cx "minSdkVersion:'$MIN_SDK'" <<< "$badging" || true)" != "1" ]; then
              echo "::error::$apk: minSdkVersion is not $MIN_SDK"
              exit 1
            fi
            native="$(grep -c '^native-code: ' <<< "$badging" || true)"
            abis="$(grep '^native-code: ' <<< "$badging" | sed -e 's/^native-code: //' -e "s/'//g" | tr ' ' '\n' | sed '/^$/d' | LC_ALL=C sort | paste -sd ' ' - || true)"
            if [ "$native" != "1" ] || grep -q '^alt-native-code' <<< "$badging" || [ "$abis" != "$want_abis" ]; then
              echo "::error::$apk: native ABIs '$abis' (expected '$want_abis')"
              exit 1
            fi
            # * the packaged .env must be the validated production one (never echoed)
            if ! unzip -p "$apk" assets/flutter_assets/.env | cmp -s - .env; then
              echo "::error::$apk: packaged .env differs from the production build config"
              exit 1
            fi
            if ! unzip -p "$apk" assets/flutter_assets/.env | python3 -c "$PROD_ENV_CHECK_PY" -; then
              echo "::error::$apk: packaged .env is not the production build config"
              exit 1
            fi
            echo "$apk: signer $actual, $want, minSdk $MIN_SDK, abis $abis"
          done
          (cd "$dir" && sha256sum ikuyo-finance-"${VERSION}"-*.apk > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - name: Remove CI signing material and backend config
        if: always()
        run: rm -f android/ikuyo-release.jks android/key.properties .env lib/libobjectbox.so

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apks-${{ steps.version.outputs.version }}
          path: |
            build/app/outputs/flutter-apk/ikuyo-finance-*.apk
            build/app/outputs/flutter-apk/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download APK artifacts
        uses: actions/download-artifact@v4
        with:
          name: apks-${{ needs.build.outputs.version }}
          path: apks/

      - name: Generate release notes
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          PREV_TAG=$(git tag --sort=-version:refname | grep -v "^${VERSION}$" | head -1)

          if [ -z "$PREV_TAG" ]; then
            LOG_RANGE="HEAD"
          else
            LOG_RANGE="${PREV_TAG}..HEAD"
          fi

          FEATURES=$(git log "$LOG_RANGE" --pretty=format:"%s" --grep="^feat" | sed 's/^[a-z]*([^)]*): //;s/^[a-z]*: //' | sed 's/^/- /')
          FIXES=$(git log "$LOG_RANGE" --pretty=format:"%s" --grep="^fix" | sed 's/^[a-z]*([^)]*): //;s/^[a-z]*: //' | sed 's/^/- /')
          PERF=$(git log "$LOG_RANGE" --pretty=format:"%s" --grep="^perf" | sed 's/^[a-z]*([^)]*): //;s/^[a-z]*: //' | sed 's/^/- /')
          REFACTOR=$(git log "$LOG_RANGE" --pretty=format:"%s" --grep="^refactor" | sed 's/^[a-z]*([^)]*): //;s/^[a-z]*: //' | sed 's/^/- /')

          {
            echo "## What's Changed"
            echo ""
            if [ -n "$FEATURES" ]; then
              echo "### ✨ Features"
              echo "$FEATURES"
              echo ""
            fi
            if [ -n "$FIXES" ]; then
              echo "### 🐛 Bug Fixes"
              echo "$FIXES"
              echo ""
            fi
            if [ -n "$PERF" ]; then
              echo "### ⚡ Performance"
              echo "$PERF"
              echo ""
            fi
            if [ -n "$REFACTOR" ]; then
              echo "### ♻️ Refactoring"
              echo "$REFACTOR"
              echo ""
            fi
            echo "---"
            echo ""
            echo "## 📥 Download"
            echo ""
            echo "| APK | Architecture | Recommended For |"
            echo "|-----|-------------|-----------------|"
            echo "| \`ikuyo-finance-${VERSION}-universal.apk\` | Universal | All devices (larger file) |"
            echo "| \`ikuyo-finance-${VERSION}-arm64-v8a.apk\` | arm64-v8a | Most modern Android (2017+) |"
            echo "| \`ikuyo-finance-${VERSION}-armeabi-v7a.apk\` | armeabi-v7a | Older Android phones |"
            echo "| \`ikuyo-finance-${VERSION}-x86_64.apk\` | x86_64 | Emulators / x86 devices |"
            echo ""
            echo "## 📋 Requirements"
            echo ""
            echo "- Android 7.0 (API ${MIN_SDK}) or higher"
            echo "- ~$(( $(stat -c %s "apks/ikuyo-finance-${VERSION}-universal.apk") / 1048576 )) MB download (universal) or ~$(( $(stat -c %s "apks/ikuyo-finance-${VERSION}-arm64-v8a.apk") / 1048576 )) MB (arm64-v8a)"
          } > release-notes.md

      - name: Verify downloaded artifact hashes
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          cd apks
          test "$(grep -cE "^[0-9a-f]{64} [ *]ikuyo-finance-${VERSION}-[a-z0-9_-]+\.apk$" SHA256SUMS.txt)" = "4"
          test "$(wc -l < SHA256SUMS.txt)" = "4"
          sha256sum -c SHA256SUMS.txt

      - name: Create draft GitHub Release (published after parent verification)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.build.outputs.version }}
          PRE_RELEASE: ${{ inputs.pre_release }}
        run: |
          # * Always a draft: the signed APKs are downloaded and verified out of
          # * band, then the draft is published explicitly (never auto-latest).
          set -euo pipefail
          ARGS=()
          if [ "$PRE_RELEASE" = "true" ]; then
            ARGS+=(--prerelease)
          fi

          if gh release view "${VERSION}" >/dev/null 2>&1; then
            echo "::error::Release ${VERSION} already exists; refusing to delete or overwrite it"
            exit 1
          fi

          gh release create "${VERSION}" \
            --draft \
            --verify-tag \
            --title "Ikuyo Finance ${VERSION}" \
            --notes-file release-notes.md \
            "${ARGS[@]}" \
            "apks/ikuyo-finance-${VERSION}-universal.apk" \
            "apks/ikuyo-finance-${VERSION}-arm64-v8a.apk" \
            "apks/ikuyo-finance-${VERSION}-armeabi-v7a.apk" \
            "apks/ikuyo-finance-${VERSION}-x86_64.apk" \
            "apks/SHA256SUMS.txt"
